apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-deployment
  template:
    metadata:
      labels:
        app: frontend-deployment
    spec:
      containers:
      - name: frontend-pod
        image: darshan616/chat-app-frontend
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: NODE_ENV
