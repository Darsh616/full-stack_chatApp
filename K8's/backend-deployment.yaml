apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers: 
      - name: backend-pod
        image: darshan616/chat-app-backend
        ports:
        - containerPort: 5001 
        env: 
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: config
              key: NODE_ENV
        - name: PORT
          value: "5001"
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: config
              key: MONGODB_URI
        - name : JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: config
              key: JWT_SECRET
  
